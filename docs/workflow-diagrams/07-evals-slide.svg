<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CaseFile evaluation scorecard</title>
  <desc id="desc">A slide-ready evaluation visualization showing nine curated retrieval scenarios flowing through semantic ranking, scope filters, and abstention checks into quality metrics, with a breakdown of 96 automated checks.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.55" stop-color="#0B2030"/>
      <stop offset="1" stop-color="#0B1827"/>
    </linearGradient>
    <linearGradient id="evalPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123747"/>
      <stop offset="1" stop-color="#102838"/>
    </linearGradient>
    <linearGradient id="insight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#302817"/>
      <stop offset="1" stop-color="#201F1B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowGold" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 1 L10 6 L0 11 Z" fill="#E6B85C"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 1 L10 6 L0 11 Z" fill="#6FA6D8"/>
    </marker>
    <style>
      text { font-family: Inter, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 3.5px; fill: #6FA6D8; }
      .headline { font-size: 48px; font-weight: 720; letter-spacing: -1.4px; fill: #F7FAFC; }
      .subtitle { font-size: 22px; font-weight: 400; fill: #AEBCCA; }
      .stage { font-size: 15px; font-weight: 760; letter-spacing: 2px; fill: #7790A5; }
      .card-title { font-size: 25px; font-weight: 700; fill: #F7FAFC; }
      .card-body { font-size: 17px; font-weight: 430; fill: #AEBCCA; }
      .metric { font-size: 44px; font-weight: 760; letter-spacing: -1px; fill: #F7FAFC; }
      .metric-label { font-size: 16px; font-weight: 700; fill: #DDE6EC; }
      .metric-note { font-size: 14px; font-weight: 430; fill: #8FA3B5; }
      .count { font-size: 34px; font-weight: 760; fill: #F7FAFC; }
      .chip { font-size: 14px; font-weight: 720; letter-spacing: .4px; }
      .lane-title { font-size: 19px; font-weight: 700; fill: #EAF1F5; }
      .lane-body { font-size: 15px; font-weight: 430; fill: #9FB0BE; }
      .coverage-title { font-size: 19px; font-weight: 720; fill: #ECF2F5; }
      .coverage-label { font-size: 14px; font-weight: 650; fill: #CAD5DD; }
      .micro { font-size: 13px; font-weight: 500; fill: #8398AA; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1640" cy="-40" r="465" fill="#123A4A" opacity="0.22"/>
  <circle cx="-10" cy="1070" r="430" fill="#132D45" opacity="0.25"/>
  <path d="M0 894 C390 815 710 994 1040 922 C1395 845 1640 825 1920 866 L1920 1080 L0 1080 Z" fill="#09131F" opacity="0.65"/>

  <!-- Header -->
  <text x="92" y="80" class="eyebrow">EVALUATION SCORECARD</text>
  <text x="92" y="142" class="headline">The system finds the right evidence—and exposes its blind spot.</text>
  <text x="92" y="182" class="subtitle">Curated scenarios measure ranking, scope control, abstention, and system boundaries.</text>
  <g transform="translate(1652 64)">
    <rect width="176" height="42" rx="21" fill="#102E3B" stroke="#2D5966"/>
    <circle cx="24" cy="21" r="7" fill="#6FA6D8"/>
    <text x="44" y="27" class="chip" fill="#DDEBEF">REPRODUCIBLE</text>
  </g>

  <!-- Stage labels -->
  <text x="96" y="266" class="stage">01 · CHALLENGE SET</text>
  <text x="548" y="266" class="stage">02 · SYSTEM UNDER EVALUATION</text>
  <text x="1338" y="266" class="stage">03 · QUALITY SIGNALS</text>

  <!-- Challenge set -->
  <g filter="url(#shadow)">
    <rect x="92" y="300" width="378" height="490" rx="30" fill="#0E1E2B" stroke="#2D4C60" stroke-width="2"/>
  </g>
  <g transform="translate(122 330)">
    <circle cx="26" cy="26" r="24" fill="#173C54"/>
    <path d="M17 18 h18 M17 26 h18 M17 34 h12" stroke="#7DB2DD" stroke-width="2.5" stroke-linecap="round"/>
    <text x="66" y="22" class="card-title">9 curated scenarios</text>
    <text x="66" y="49" class="card-body">Synthetic, labeled, repeatable</text>
  </g>

  <g transform="translate(122 420)">
    <rect width="318" height="84" rx="18" fill="#122A3B" stroke="#294D65"/>
    <text x="24" y="33" class="count">7</text>
    <text x="76" y="31" class="metric-label">positive queries</text>
    <text x="76" y="57" class="metric-note">Known relevant card or rule</text>
  </g>
  <g transform="translate(122 520)">
    <rect width="318" height="84" rx="18" fill="#28241B" stroke="#66552E"/>
    <text x="24" y="33" class="count" fill="#F0C96F">2</text>
    <text x="76" y="31" class="metric-label">hard negatives</text>
    <text x="76" y="57" class="metric-note">Correct answer is “no result”</text>
  </g>

  <g transform="translate(122 632)">
    <rect width="148" height="100" rx="18" fill="#111F2B" stroke="#334959"/>
    <text x="20" y="42" class="count">5</text>
    <text x="20" y="70" class="metric-label">evidence cards</text>
  </g>
  <g transform="translate(292 632)">
    <rect width="148" height="100" rx="18" fill="#111F2B" stroke="#334959"/>
    <text x="20" y="42" class="count">3</text>
    <text x="20" y="70" class="metric-label">debate rules</text>
  </g>
  <text x="122" y="766" class="micro">Includes cross-resolution and wrong-side distractors</text>

  <!-- Arrow to evaluator -->
  <path d="M470 547 C505 547 514 547 538 547" fill="none" stroke="#6FA6D8" stroke-width="3.5" marker-end="url(#arrowBlue)"/>

  <!-- System under evaluation -->
  <g filter="url(#shadow)">
    <rect x="548" y="300" width="702" height="490" rx="30" fill="url(#evalPanel)" stroke="#31566B" stroke-width="2"/>
  </g>
  <g transform="translate(580 328)">
    <rect width="168" height="34" rx="17" fill="#173B4C" stroke="#356174"/>
    <circle cx="20" cy="17" r="5" fill="#E6B85C"/>
    <text x="36" y="22" class="chip" fill="#D8E4E9">RETRIEVAL EVAL</text>
  </g>

  <!-- Evaluation lanes -->
  <g transform="translate(580 395)" filter="url(#softShadow)">
    <rect width="638" height="94" rx="20" fill="#102535" stroke="#3B6883" stroke-width="2"/>
    <circle cx="48" cy="47" r="24" fill="#183E58"/>
    <path d="M38 53 l9 -12 l8 7 l9 -14" fill="none" stroke="#81B8E5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="39" class="lane-title">Semantic ranking</text>
    <text x="90" y="65" class="lane-body">Does the relevant evidence appear—and how high?</text>
    <rect x="492" y="31" width="118" height="32" rx="16" fill="#15354A"/>
    <text x="551" y="52" text-anchor="middle" class="chip" fill="#86BCE6">RECALL · MRR</text>
  </g>

  <path d="M899 489 L899 514" stroke="#66889D" stroke-width="2.5" stroke-dasharray="5 6"/>

  <g transform="translate(580 514)" filter="url(#softShadow)">
    <rect width="638" height="94" rx="20" fill="#102535" stroke="#43647A" stroke-width="2"/>
    <circle cx="48" cy="47" r="24" fill="#1B3A4B"/>
    <path d="M36 39 h24 l-9 10 v10 l-6 3 v-13 z" fill="none" stroke="#9EB7C8" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="90" y="39" class="lane-title">Scope filters</text>
    <text x="90" y="65" class="lane-body">Does resolution and side stay inside the request boundary?</text>
    <rect x="472" y="31" width="138" height="32" rx="16" fill="#183142"/>
    <text x="541" y="52" text-anchor="middle" class="chip" fill="#A9BECC">FILTER LEAKAGE</text>
  </g>

  <path d="M899 608 L899 633" stroke="#66889D" stroke-width="2.5" stroke-dasharray="5 6"/>

  <g transform="translate(580 633)" filter="url(#softShadow)">
    <rect width="638" height="94" rx="20" fill="#262319" stroke="#7A6431" stroke-width="2"/>
    <circle cx="48" cy="47" r="24" fill="#44391E"/>
    <path d="M36 47 h24 M48 35 v24" stroke="#EAC56D" stroke-width="2.8" stroke-linecap="round" transform="rotate(45 48 47)"/>
    <text x="90" y="39" class="lane-title">Abstention check</text>
    <text x="90" y="65" class="lane-body">Can the system return nothing when evidence is irrelevant?</text>
    <rect x="466" y="31" width="144" height="32" rx="16" fill="#3A311B"/>
    <text x="538" y="52" text-anchor="middle" class="chip" fill="#E9C76E">NO-RESULT ACC.</text>
  </g>
  <text x="580" y="758" class="micro">k = 3 · stored embedding text · local benchmark</text>

  <!-- Arrow to signals -->
  <path d="M1250 547 C1280 547 1290 547 1328 547" fill="none" stroke="#E6B85C" stroke-width="3.5" marker-end="url(#arrowGold)"/>

  <!-- Quality scorecard -->
  <g filter="url(#shadow)">
    <rect x="1338" y="300" width="490" height="490" rx="30" fill="#0E1E2B" stroke="#2D4C60" stroke-width="2"/>
  </g>
  <text x="1370" y="353" class="card-title">Retrieval quality</text>
  <text x="1370" y="382" class="card-body">What the benchmark says today</text>

  <g transform="translate(1370 414)" filter="url(#softShadow)">
    <rect width="204" height="128" rx="20" fill="#12332E" stroke="#347661" stroke-width="2"/>
    <text x="24" y="54" class="metric" fill="#66D3AA">100%</text>
    <text x="24" y="84" class="metric-label">Recall@3</text>
    <text x="24" y="107" class="metric-note">Right evidence retrieved</text>
  </g>
  <g transform="translate(1592 414)" filter="url(#softShadow)">
    <rect width="204" height="128" rx="20" fill="#132E42" stroke="#386B8B" stroke-width="2"/>
    <text x="24" y="54" class="metric" fill="#7EB7E4">1.00</text>
    <text x="24" y="84" class="metric-label">MRR</text>
    <text x="24" y="107" class="metric-note">Correct result ranks first</text>
  </g>

  <g transform="translate(1370 560)" filter="url(#softShadow)">
    <rect width="204" height="128" rx="20" fill="#153139" stroke="#3F6C72" stroke-width="2"/>
    <text x="24" y="54" class="metric" fill="#8FC8C9">0</text>
    <text x="24" y="84" class="metric-label">Filter leakage</text>
    <text x="24" y="107" class="metric-note">Scope boundary preserved</text>
  </g>
  <g transform="translate(1592 560)" filter="url(#softShadow)">
    <rect width="204" height="128" rx="20" fill="#392F1A" stroke="#8B7035" stroke-width="2"/>
    <text x="24" y="54" class="metric" fill="#F0C96F">50%</text>
    <text x="24" y="84" class="metric-label">No-result accuracy</text>
    <text x="24" y="107" class="metric-note">Abstention is the gap</text>
  </g>

  <g transform="translate(1370 710)">
    <rect width="426" height="50" rx="16" fill="#142B37" stroke="#315263"/>
    <text x="22" y="31" class="metric-label">Overall query success</text>
    <text x="398" y="33" text-anchor="end" class="card-title" fill="#E8EEF2">88.9%</text>
  </g>

  <!-- Coverage panel -->
  <g filter="url(#softShadow)">
    <rect x="92" y="846" width="1736" height="174" rx="28" fill="#0D1B27" stroke="#294557" stroke-width="2"/>
  </g>
  <g transform="translate(124 873)">
    <text x="0" y="24" class="count">96</text>
    <text x="70" y="20" class="coverage-title">automated checks</text>
    <text x="70" y="46" class="micro">Coverage across the full system—not just retrieval</text>
  </g>

  <!-- Proportional coverage bar: total usable width 1644, proportions 41/27/19/9 -->
  <g transform="translate(124 943)">
    <rect width="702" height="28" rx="14" fill="#4B5FC0"/>
    <rect x="702" width="463" height="28" fill="#2E8C78"/>
    <rect x="1165" width="325" height="28" fill="#397AA2"/>
    <rect x="1490" width="154" height="28" rx="14" fill="#A8783A"/>
  </g>

  <g transform="translate(124 991)">
    <circle cx="7" cy="0" r="7" fill="#4B5FC0"/>
    <text x="22" y="5" class="coverage-label">41 · Agent orchestration &amp; contracts</text>
  </g>
  <g transform="translate(552 991)">
    <circle cx="7" cy="0" r="7" fill="#2E8C78"/>
    <text x="22" y="5" class="coverage-label">27 · Security &amp; failure modes</text>
  </g>
  <g transform="translate(978 991)">
    <circle cx="7" cy="0" r="7" fill="#397AA2"/>
    <text x="22" y="5" class="coverage-label">19 · Retrieval &amp; ingestion</text>
  </g>
  <g transform="translate(1390 991)">
    <circle cx="7" cy="0" r="7" fill="#A8783A"/>
    <text x="22" y="5" class="coverage-label">9 · API boundaries</text>
  </g>

  <!-- Takeaway ribbon -->
  <g transform="translate(1205 872)">
    <rect width="591" height="55" rx="18" fill="url(#insight)" stroke="#776335"/>
    <circle cx="29" cy="27.5" r="9" fill="#E6B85C"/>
    <text x="51" y="24" class="metric-label" fill="#F5E7C4">Key finding</text>
    <text x="51" y="43" class="micro" fill="#CEBD92">Retrieval is strong; rejecting irrelevant queries is next.</text>
  </g>

  <text x="1828" y="1048" text-anchor="end" class="micro">Current local benchmark · 9 cases · results should be labeled with run date in presentation</text>
</svg>
