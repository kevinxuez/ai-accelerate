[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casefile-debate-agent"
version = "0.1.0"
description = "Citation-preserving Public Forum debate evidence and coaching agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
agent = ["anthropic>=0.49,<1", "langgraph>=0.2,<1"]
vector = ["chromadb>=0.6,<2"]
mcp = ["mcp>=1.2,<2"]
calendar = [
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
]
all = [
  "anthropic>=0.49,<1",
  "langgraph>=0.2,<1",
  "chromadb>=0.6,<2",
  "mcp>=1.2,<2",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
casefile = "casefile.cli:main"
casefile-ingest = "casefile.ingest.pipeline:main"
casefile-eval = "casefile.evals.run_eval:main"
casefile-security-eval = "casefile.evals.run_security_eval:main"

[tool.setuptools.packages.find]
include = ["casefile*"]

[tool.setuptools.package-data]
casefile = [
  "data/*.json",
  "rules/*.md",
  "ingest/*.json",
  "evals/*.json",
  "evals/*.md",
  "chroma_db/.gitkeep",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
